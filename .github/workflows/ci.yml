name: CI

# 一档：这个仓库现在只有一个介质 —— 合法 C11 加声明表，纯 cc，不依赖任何自定义前端。
# 这条流水线跑的就是"结果能不能被验收"：
#   compat   合法 C 在无本层/有本层两种口径下都要编得过且输出一致（超集的字面判据）
#   build    编用户 TU → 符号审计 → 接线检查 → 链接（任何一步红就停）
#   oracle   DP_EXAMPLES 的封闭样例，一条一个进程
#   mutate   对纯决定做机械变异，逐条断言预期结局与归因
#   accept   30 条 wire 断言（服务对外的承诺）
#   contract DP_GOALS 与断言编号对账（目标是否都被证明、断言是否都有归属）
#   req      需求条款 ↔ 目标 ↔ 断言/样例 的登记链（孤儿断言/样例/目标 = 红）
#   freeze   题面（验收表/声明头/契约）与 req/FROZEN 一致，改题必须显式 --update
#   score    变异覆盖分：30 条断言每条都至少被一条实现变异弄红（floor = 断言总数）
#   surface  必读面的字节/token 预算（面有没有悄悄膨胀）
#   compare  候选比较：样例能不能把唯一正确的一份挑出来（含自检）
#   firstpass 首次成功率量尺（含自检；没有模型数据，数字不在这里产生）
#   maint    三种典型改动的文件/行数预算
#   loop     作者回路：check.sh 一条命令一个退出码；brief 题面包不含实现；submit 能收也能拒
#   report   人类验收页：目标 -> 断言 -> 红绿，一屏
#   sabotage 20 条破坏测试，每条必须由具体工具以具体诊断抓住
#
# soak.sh 不在这里：它要一台长时间常开的机器。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sup:
    name: 超集（纯 cc）
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— 基线门要 `git archive <req/BASELINE 里的 commit>` 导旧实现。
      # 默认浅 clone 只有 1 层，导不出来就会把这一层判成红（不是假绿，是假红），所以这里取全历史。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 兼容性实测（合法 C 两种口径）
        run: sh code/sup/compat-sup.sh ci-compat
      - name: 构建 = 编用户 TU + 符号审计 + 接线检查
        run: sh code/sup/build.sh ci-sup
      - name: 样例 oracle（DP_EXAMPLES，一条一个进程）
        run: sh code/sup/oracle-sup.sh ci-oracle
      - name: 决定层变异测试
        run: sh code/sup/mutate-dec.sh ci-mutate
      - name: 30 条断言验收表
        run: sh code/sup/accept-sup.sh "$GITHUB_WORKSPACE/.build/ci-sup/blobd" 18951 ci
      - name: 契约对账（目标 ↔ 断言编号）
        run: python3 code/sup/contract-sup.py "$GITHUB_WORKSPACE/.build/ci-sup/blobd"
      - name: 需求登记（条款 ↔ 目标 ↔ 断言/样例）
        run: python3 code/sup/req-check.py "$GITHUB_WORKSPACE/.build/ci-sup/blobd"
      - name: 题面冻结（验收表/声明头/契约没被改过）
        run: sh code/sup/freeze.sh --check "$GITHUB_WORKSPACE/.build/ci-sup/blobd"
      - name: 变异覆盖分（每条断言都能被弄红）
        run: python3 code/sup/mutation-score.py --binary "$GITHUB_WORKSPACE/.build/ci-sup/blobd" --l-port 18340 --s-port 18440
      - name: 必读面预算
        run: sh code/sup/surface-budget.sh
      - name: 候选比较自检（唯一/无解/歧义）
        run: sh code/sup/compare-sup.sh --self-test
      - name: 首次成功率量尺自检
        run: sh code/sup/firstpass.sh --self-test
      - name: 维护成本（改动局部性）
        run: sh code/sup/maint-cost.sh
      - name: 作者回路（一条命令一个退出码）
        run: sh code/sup/check.sh
      - name: 题面包（不含实现文件，且在预算内）
        run: sh code/sup/brief.sh "$GITHUB_WORKSPACE/.build/briefpack"
      - name: 实验题面包（可从零交给任意模型）
        run: sh code/sup/lab/make-packet.sh "$GITHUB_WORKSPACE/.build/labpacket"
      - name: 提交口（参考实现必须被接受）
        run: sh code/sup/submit-sup.sh code/sup/dp_decide.c 18953
      - name: 人类验收页（目标 -> 断言 -> 红绿）
        run: sh code/sup/report.sh "$GITHUB_WORKSPACE/.build/ci-sup/blobd" --accept 18952
      - name: 破坏测试（每条断言归因到具体工具）
        run: sh code/sup/sabotage-sup.sh 18960
