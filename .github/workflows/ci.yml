name: CI

# 这个仓库只有一条线：语言 = drop/，定义 = drop/spec.txt。
# 两个 job：
#   drop    一页定义自己的门（五段 + 十八条破坏）+ 编译器对账（产物必须与参考实现逐字同输出）
#   hosts   同一页定义长出的两份解释器对账 —— 语料逐字节、报错样本的（行，码）、真 socket 的 88 行实录。
#           它跟 drop 档没有依赖，所以单开一个 job：drop 的绿色一分钟都不该等 dotnet。
#           没有 dotnet 的机器上 conform.sh 自己明说"这段没跑"（红都不算）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drop:
    name: 一页定义 + 裸 ELF 编译器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 门（例子 / 定义↔实现对账 / 预算与分界 / 真 socket / 十八条破坏）
        run: sh drop/check.sh
      - name: 编译器对账（逐字同输出 + 无 INTERP 段 + 量尺）
        run: python3 tools/codegen_check.py

  hosts:
    name: 两份宿主一份定义
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 对账（语料逐字节 / 报错样本 / 服务器实录 / 耗时只报数）
        run: sh drop/conform.sh
