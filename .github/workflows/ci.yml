name: CI

# 一档：这个仓库现在只有一个介质 —— 合法 C11 加声明表，纯 cc，不依赖任何自定义前端。
# 这条流水线跑的就是"结果能不能被验收"：
#   compat   合法 C 在无本层/有本层两种口径下都要编得过且输出一致（超集的字面判据）
#   build    编用户 TU → 符号审计 → 接线检查 → 链接（任何一步红就停）
#   oracle   DP_EXAMPLES 的封闭样例，一条一个进程
#   mutate   对纯决定做机械变异，逐条断言预期结局与归因
#   accept   24 条 wire 断言（服务对外的承诺）
#   contract DP_GOALS 与断言编号对账（目标是否都被证明、断言是否都有归属）
#   sabotage 11 条破坏测试，每条必须由具体工具以具体诊断抓住
#
# soak.sh 不在这里：它要一台长时间常开的机器。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sup:
    name: 超集（纯 cc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 兼容性实测（合法 C 两种口径）
        run: sh code/sup/compat-sup.sh ci-compat
      - name: 构建 = 编用户 TU + 符号审计 + 接线检查
        run: sh code/sup/build.sh ci-sup
      - name: 样例 oracle（DP_EXAMPLES，一条一个进程）
        run: sh code/sup/oracle-sup.sh ci-oracle
      - name: 决定层变异测试
        run: sh code/sup/mutate-dec.sh ci-mutate
      - name: 24 条断言验收表
        run: sh code/sup/accept-sup.sh "$GITHUB_WORKSPACE/.build/ci-sup/blobd" 18951 ci
      - name: 契约对账（目标 ↔ 断言编号）
        run: python3 code/sup/contract-sup.py "$GITHUB_WORKSPACE/.build/ci-sup/blobd"
      - name: 破坏测试（每条断言归因到具体工具）
        run: sh code/sup/sabotage-sup.sh 18960
